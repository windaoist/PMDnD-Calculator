name: Build Electron Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install
      run:
        npm install

    - name: Build
      run:
        npm run make:portable

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/make/**
